<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c3ceca"><meta name="description" content="淡い海、奇妙な植物、面をつけた島民。塩田、風車、白い灯台へ。淡い海の島々をめぐる一人称探索。"><meta name="nagi-release" content="2026-10-18-movement-core"><title>凪の島 — NAGI</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./assets/nagi-icon-120.png">
<link rel="apple-touch-icon" sizes="120x120" href="./assets/nagi-icon-120.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="凪の島">
<script>
 window.nagiBoot=String(Date.now());
 const css=document.createElement('link');css.rel='stylesheet';css.href='./style.css?reload='+window.nagiBoot;document.head.append(css);
</script></head>
<body>
<canvas id="world" tabindex="0" aria-label="凪の島。WASDで移動、左右矢印で旋回。画面下半分で一本指を置き、上で前進、下で後退、左右で旋回します。離すと停止します。"></canvas>
<div class="grain" aria-hidden="true"></div><div class="shade" aria-hidden="true"></div>
<section id="arrival" aria-label="島へ渡る">
<div class="edition">A SMALL ISLAND, SOMEWHERE IN SETOUCHI</div>
<div class="intro"><div class="eyebrow">ひとりで歩く、小さな異郷。</div><h1>凪の島<span>N A G I</span></h1><p>潮がひいて、道ができた。<br>まだ名前を知らない、あなたのために。</p><button id="begin" type="button" disabled aria-busy="true">島へ渡る <span aria-hidden="true">⟶</span></button></div>
<div class="notes"><span>歩きかた</span><p>画面の下半分で、指を少し上へ。そのままで前進。<br>下で後退、左右で旋回。斜めで曲がりながら進む。<br>大きく上へ動かすと走る。離すと停止。PCは W A S D · ← →。</p><small>視点の上下・揺れなし · 足音と海の音が流れます</small></div>
<div class="folio">凪 ／ 小さな島の習作 <i>01</i></div>
</section>
<div id="place" aria-live="polite"><span id="place-jp"></span><small id="place-en"></small></div>
<div id="greeting" role="status" aria-live="polite"><span id="speaker"></span><p id="words"></p></div>
<div id="hint">ゆっくり、どうぞ。</div>
<div id="error" role="alert" hidden>この島には WebGL が必要です。WebGL に対応したブラウザで開いてください。</div>
<script type="module">
 const fail=()=>{const error=document.querySelector('#error');if(error.hidden){error.textContent='島を読み込めませんでした。ページを開き直してください。';error.hidden=false;}document.querySelector('#begin').disabled=true;};
 window.addEventListener('error',fail,{once:true});
 import('./island.js?reload='+window.nagiBoot).catch(fail);
</script>
</body></html>
