<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c3ceca"><meta name="description" content="淡い海、奇妙な植物、面をつけた島民。何も急がなくていい、小さな島の一人称探索。"><title>凪の島 — NAGI</title><link rel="stylesheet" href="style.css"></head>
<body>
<canvas id="world" tabindex="0" aria-label="凪の島。WASDで移動、左右矢印で旋回。画面下半分で指を置き、上にスライドすると前進します。離すと停止します。"></canvas>
<div class="grain" aria-hidden="true"></div><div class="shade" aria-hidden="true"></div>
<section id="arrival" aria-label="島へ渡る">
<div class="edition">A SMALL ISLAND, SOMEWHERE IN SETOUCHI</div>
<div class="intro"><div class="eyebrow">ひとりで歩く、小さな異郷。</div><h1>凪の島<span>N A G I</span></h1><p>潮がひいて、道ができた。<br>まだ名前を知らない、あなたのために。</p><button id="begin">島へ渡る <span aria-hidden="true">⟶</span></button></div>
<div class="notes"><span>歩きかた</span><p>画面の下半分に指を置き、上へスライドで走る。<br>下で後退、左右でカニ歩き。大きく横へ滑らせると旋回。<br>指を離すと停止。キーボードは W A S D · ← →。</p><small>視点の上下・揺れなし · 足音と海の音が流れます</small></div>
<div class="folio">凪 ／ 小さな島の習作 <i>01</i></div>
</section>
<div id="place" aria-live="polite"><span id="place-jp"></span><small id="place-en"></small></div>
<div id="greeting" role="status" aria-live="polite"><span id="speaker"></span><p id="words"></p></div>
<div id="hint">ゆっくり、どうぞ。</div>
<div id="error" role="alert" hidden>この島には WebGL が必要です。WebGL に対応したブラウザで開いてください。</div>
<script type="module" src="island.js"></script>
</body></html>
